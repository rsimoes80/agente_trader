server {
    listen 192.168.97.221:8097;
    server_name _;
    root /usr/share/nginx/html;
    index operation.html;

    location /api/diagnostics/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        add_header Cache-Control "no-store";
    }

    location = /diagnostico {
        try_files /diagnostics.html =404;
    }
    location = /treinamento {
        try_files /training.html =404;
    }
    location = /treinamento/ {
        try_files /training.html =404;
    }
    location = /diagnostico/ {
        try_files /diagnostics.html =404;
    }

    location = /mercado {
        try_files /chart.html =404;
    }

    # Terminal RPC is available only directly from the private Linux worker.
    location = /api/mt5/rpc {
        return 404;
    }

    location /api/mt5/ {
        add_header Cache-Control "no-store";
        proxy_pass http://192.168.200.1:8769;
        proxy_set_header X-Bridge-Token "${MT5_BRIDGE_TOKEN}";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @mt5_bridge_unavailable;
    }

    location @mt5_bridge_unavailable {
        default_type application/json;
        return 503 '{"ok":false,"error":"Conexão com a ponte de dados temporariamente indisponível; reconexão automática."}';
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /operation.html;
    }
}
