# Bound the optional CPU literature model on the 12-GiB Ubuntu WSL VM.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=2

[Service]
ExecStart=
ExecStart=%h/agente_trader/.tools/llama-reader/llama-b11962/llama-server --model %h/agente_trader/data/models/literature-reader/Qwen3-4B-Q4_K_M.gguf --host 127.0.0.1 --port 8791 --ctx-size 8192 --parallel 1 --threads 2 --threads-batch 2 --batch-size 256 --ubatch-size 64 --n-gpu-layers 0 --chat-template-kwargs '{"enable_thinking":false}'
MemoryAccounting=yes
MemoryHigh=4G
MemoryMax=5G
MemorySwapMax=256M
CPUQuota=200%
Nice=10
TasksMax=128
TimeoutStopSec=10
RestartSec=60
